<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7bf7"/>
      <stop offset="1" stop-color="#5a4fd6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2b1a6b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <polygon points="0,0 512,0 0,512" fill="url(#beam)"/>
  <rect x="34" y="52" width="444" height="408" fill="none" stroke="#ff2b2b" stroke-width="12" stroke-dasharray="24 18"/>
  <rect x="120" y="76" width="272" height="360" fill="#fff" filter="url(#paperShadow)"/>
  <line x1="138" y1="96" x2="374" y2="96" stroke="#ff2b2b" stroke-width="3"/>
  <g fill="#000" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="138" y="132" font-size="34" letter-spacing="1">PHOTO</text>
    <text x="374" y="288" font-size="28" text-anchor="end">to</text>
    <text x="136" y="416" font-size="54" letter-spacing="1">TEXT</text>
  </g>
  <g stroke="#000" stroke-width="2.4" stroke-linecap="square">
    <line x1="138" y1="152" x2="374" y2="152"/>
    <line x1="138" y1="192" x2="374" y2="192"/>
    <line x1="138" y1="232" x2="374" y2="232"/>
    <line x1="138" y1="272" x2="328" y2="272"/>
    <line x1="138" y1="312" x2="374" y2="312"/>
    <line x1="138" y1="352" x2="374" y2="352"/>
  </g>
</svg>
